<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>NewsFeed</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Nocturne tokens */
  :root{
    --color-bg:#161826;
    --color-surface:#232532;
    --color-text:#e4e7f5;
    --color-accent:#9184d9;
    --color-divider:color-mix(in srgb, #e9e9ed 16%, transparent);

    --color-neutral-300:#cfd3e5;
    --color-neutral-400:#b2b6ca;
    --color-neutral-500:#9397ab;
    --color-neutral-600:#75798c;
    --color-neutral-700:#595d6c;
    --color-neutral-800:#3f424d;
    --color-neutral-900:#292b31;

    --color-accent-300:#d2cefd;
    --color-accent-400:#b5abfc;
    --color-accent-700:#5d5294;

    --font-heading:"Inter", system-ui, sans-serif;
    --font-body:"Inter", system-ui, sans-serif;

    --radius-sm:4px;
    --radius-md:8px;

    --shadow-sm:0 0 0 1px #3f424d;
    --shadow-md:0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);}
  body{min-height:100vh;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  ::selection{background:color-mix(in srgb, var(--color-accent) 32%, transparent);}
  h1,h2,h3{font-family:var(--font-heading);font-weight:500;margin:0;}
  a{color:var(--color-accent-300);text-underline-offset:3px;}
  a:hover{color:var(--color-accent-400);}
  button{font-family:var(--font-body);}
  :focus{outline:none;}
  :focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;}

  /* ---------- sticky chrome ---------- */
  .chrome{position:sticky;top:0;z-index:20;background:var(--color-bg);}
  .bar{display:flex;align-items:center;gap:14px;padding:16px 32px 4px;}
  .brand{font-family:var(--font-heading);font-weight:500;font-size:15px;letter-spacing:.01em;margin-right:auto;}
  .stamp{font-size:12px;color:var(--color-neutral-600);white-space:nowrap;}

  .icon-btn{
    background:transparent;border:1px solid var(--color-divider);color:var(--color-neutral-400);
    width:30px;height:30px;border-radius:var(--radius-sm);cursor:pointer;
    font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;flex:none;
    transition:border-color .18s ease,color .18s ease;
  }
  .icon-btn:hover{border-color:var(--color-accent);color:var(--color-accent-300);}
  .icon-btn[aria-expanded="true"]{border-color:var(--color-accent);color:var(--color-accent-300);}

  .refresh-btn{
    background:transparent;border:1px solid var(--color-accent);color:var(--color-accent-300);
    font-family:var(--font-heading);font-weight:500;font-size:12.5px;
    padding:7px 14px;border-radius:var(--radius-sm);cursor:pointer;flex:none;
    display:flex;align-items:center;gap:7px;transition:background .18s ease;
  }
  .refresh-btn:hover{background:color-mix(in srgb, var(--color-accent) 14%, transparent);}
  .refresh-btn:active{border-color:var(--color-accent-400);}
  .refresh-btn:disabled{opacity:.45;cursor:default;}
  .spin{
    width:11px;height:11px;border-radius:50%;flex:none;
    border:1.5px solid color-mix(in srgb, var(--color-accent) 35%, transparent);
    border-top-color:var(--color-accent-300);
    animation:spin .7s linear infinite;display:none;
  }
  .refresh-btn.loading .spin{display:block;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .tabs{display:flex;padding:0 32px;}
  .tab{
    position:relative;flex:1;min-width:0;text-align:left;
    background:transparent;border:0;cursor:pointer;white-space:nowrap;
    font-family:var(--font-heading);font-weight:500;font-size:19px;letter-spacing:-.015em;
    color:var(--color-neutral-600);padding:14px 0 16px;
    transition:color .18s ease;
  }
  .tab:hover{color:var(--color-neutral-400);}
  .tab.active{color:var(--color-text);}
  .tab .mark{position:absolute;left:0;right:8px;bottom:0;height:2px;border-radius:2px;background:transparent;transition:background .18s ease;}
  .tab.active .mark{background:var(--color-accent);}
  .tab .count{font-size:12px;color:var(--color-accent-300);vertical-align:super;margin-left:3px;}

  .rule{height:1px;background:linear-gradient(90deg,transparent 0,var(--color-divider) 48px,var(--color-divider) calc(100% - 48px),transparent 100%);}

  .progress{height:2px;background:transparent;overflow:hidden;}
  .progress .fill{height:100%;width:0;background:var(--color-accent);transition:width .3s ease;}

  /* ---------- menu ---------- */
  .menu{
    display:none;padding:20px 32px 24px;border-bottom:1px solid var(--color-divider);
    background:var(--color-bg);
  }
  .menu.open{display:block;}
  .menu-grid{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start;}
  .menu-block{display:flex;flex-direction:column;gap:8px;min-width:260px;flex:1;}
  .menu-label{font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600);}
  .input,.select{
    width:100%;min-height:34px;padding:7px 10px;font:inherit;font-size:13.5px;
    color:var(--color-text);background:var(--color-surface);caret-color:var(--color-accent);
    border:1px solid var(--color-divider);border-radius:var(--radius-sm);
  }
  .input:hover,.select:hover{border-color:var(--color-neutral-700);}
  .input:focus-visible,.select:focus-visible{border-color:var(--color-accent);outline-offset:0;}
  .input::placeholder{color:var(--color-neutral-600);}
  .row{display:flex;gap:8px;}
  .ghost-btn{
    background:transparent;border:1px solid var(--color-divider);color:var(--color-neutral-300);
    font-family:var(--font-heading);font-weight:500;font-size:12.5px;
    padding:7px 14px;border-radius:var(--radius-sm);cursor:pointer;white-space:nowrap;
    transition:border-color .18s ease,color .18s ease;
  }
  .ghost-btn:hover{border-color:var(--color-accent);color:var(--color-accent-300);}
  .ghost-btn:disabled{opacity:.45;cursor:default;}
  .note{font-size:11.5px;line-height:1.5;color:var(--color-neutral-600);}
  .note.err{color:var(--color-accent-300);}

  /* ---------- feed ---------- */
  .feed{padding:36px 32px 110px;}
  .day{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600);margin:0 0 20px;}
  .day-block{margin-bottom:36px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;}

  .card{
    background:var(--color-surface);border-radius:var(--radius-md);padding:20px;
    cursor:pointer;display:flex;flex-direction:column;gap:12px;
    box-shadow:var(--shadow-sm);transition:box-shadow .18s ease,opacity .2s ease;
  }
  .card:hover{box-shadow:var(--shadow-md);}
  .card.open{grid-column:1 / -1;}
  .card.dismissed{opacity:.4;}
  .card.dismissed .card-title{text-decoration:line-through;text-decoration-thickness:1px;}

  .card-meta{display:flex;align-items:center;gap:12px;}
  .dot{width:5px;height:5px;border-radius:5px;background:var(--color-accent);flex:none;}
  .dot.read{background:transparent;}
  .kicker{font-size:10px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--color-accent-300);}
  .when{font-size:11.5px;color:var(--color-neutral-600);margin-left:auto;white-space:nowrap;}
  .card-title{font-family:var(--font-heading);font-weight:500;font-size:19px;line-height:1.25;letter-spacing:-.012em;}
  .card-teaser{font-size:14px;line-height:1.5;margin:0;color:var(--color-neutral-500);}
  .card-source{font-size:11.5px;color:var(--color-neutral-600);margin-top:auto;display:flex;gap:8px;align-items:center;}
  .badge{color:var(--color-accent-300);font-style:italic;}

  .card-body{display:none;padding-top:16px;margin-top:4px;border-top:1px solid var(--color-divider);animation:fade .22s ease;}
  .card.open .card-body{display:block;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .summary{font-size:14px;line-height:1.65;margin:0 0 16px;color:var(--color-neutral-300);max-width:62em;}
  .summary.pending{color:var(--color-neutral-600);font-style:italic;}
  .actions{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
  .link{font-family:var(--font-heading);font-weight:500;font-size:12.5px;text-decoration:none;}
  .text-btn{background:transparent;border:0;padding:0;font-size:12.5px;color:var(--color-neutral-600);cursor:pointer;transition:color .18s ease;}
  .text-btn:hover{color:var(--color-accent-300);}

  /* ---------- read pile ---------- */
  .pile{border-top:1px solid var(--color-divider);padding-top:24px;}
  .pile-toggle{background:transparent;border:0;padding:0;font-family:var(--font-heading);font-weight:500;font-size:12.5px;color:var(--color-neutral-500);cursor:pointer;transition:color .18s ease;}
  .pile-toggle:hover{color:var(--color-accent-300);}
  .pile-grid{display:none;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:20px;}
  .pile-grid.open{display:grid;}
  .pile-card{border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:20px;cursor:pointer;transition:border-color .18s ease;}
  .pile-card:hover{border-color:var(--color-neutral-700);}
  .pile-meta{font-size:12px;color:var(--color-neutral-600);margin-bottom:8px;}
  .pile-title{font-family:var(--font-heading);font-weight:500;font-size:15px;line-height:1.3;color:var(--color-neutral-500);}

  .empty{padding:80px 0;color:var(--color-neutral-600);font-size:14px;max-width:34em;}

  /* pull-to-refresh indicator */
  .pull{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:30;}
  .pull span{
    font-size:11.5px;color:var(--color-accent-300);background:var(--color-surface);
    border:1px solid var(--color-divider);border-top:0;
    border-radius:0 0 var(--radius-md) var(--radius-md);
    padding:5px 14px;transform:translateY(-100%);transition:transform .2s ease;
  }
  .pull.show span{transform:translateY(0);}

  @media (max-width:820px){
    .bar{padding:14px 18px 4px;}
    .tabs{padding:0 18px;overflow-x:auto;}
    .tab{flex:none;font-size:16px;padding:12px 0 14px;margin-right:22px;}
    .tab .mark{right:0;}
    .feed{padding:24px 18px 90px;}
    .menu{padding:18px;}
    .stamp{display:none;}
    .grid,.pile-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="pull" id="pull"><span>Release to refresh</span></div>

<div class="chrome">
  <div class="bar">
    <span class="brand">NewsFeed</span>
    <span class="stamp" id="stamp">—</span>
    <button class="refresh-btn" id="refresh-btn"><span class="spin"></span><span id="refresh-label">Refresh</span></button>
    <button class="icon-btn" id="menu-btn" aria-expanded="false" aria-label="More">⋯</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="rule"></div>
  <div class="progress"><div class="fill" id="progress-fill"></div></div>
</div>

<div class="menu" id="menu">
  <div class="menu-grid">
    <div class="menu-block">
      <span class="menu-label">Add a story it missed</span>
      <input class="input" id="submit-url" type="url" placeholder="Paste article URL">
      <div class="row">
        <select class="select" id="submit-bucket"></select>
        <button class="ghost-btn" id="submit-go">Add</button>
      </div>
      <input class="input" id="submit-note" type="text" placeholder="Note (optional)">
      <div class="note" id="submit-status">The source becomes trusted and shapes future picks.</div>
    </div>
    <div class="menu-block">
      <span class="menu-label">Filter by tag</span>
      <select class="select" id="tag-filter">
        <option value="all">All tags</option>
        <option value="Product Launch">Product Launch</option>
        <option value="Earnings">Earnings</option>
        <option value="Partnership">Partnership</option>
        <option value="AI Fabric">AI Fabric</option>
        <option value="Executive Move">Executive Move</option>
        <option value="Industry Standard">Industry Standard</option>
        <option value="Other">Other</option>
      </select>
      <div class="note" id="feed-note"></div>
    </div>
  </div>
</div>

<div class="feed" id="feed"></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// ---- PASTE YOUR REAL VALUES HERE ----
const SUPABASE_URL = "https://lbkvvpikphwzquuavwzf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxia3Z2cGlrcGh3enF1dWF2d3pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMjIzNTIsImV4cCI6MjEwMzg5ODM1Mn0.yP-WPFUVAXJGaOxqRw6gDmrEjoo2eW4X78E7tvTvDuY";
const REFRESH_SECRET = "Letmein";
// --------------------------------------

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const BUCKETS = [
  { id: "all", label: "All" },
  { id: "hpe", label: "HPE" },
  { id: "cisco", label: "Cisco" },
  { id: "arista", label: "Arista" },
  { id: "silicon", label: "Silicon" },
  { id: "ai_industry", label: "AI" },
  { id: "space", label: "Space" },
  { id: "standards", label: "Standards" },
];

const FULL_NAMES = {
  hpe: "HPE Networking (Juniper + Aruba)",
  cisco: "Cisco",
  arista: "Arista",
  silicon: "Silicon & Industry Trends",
  ai_industry: "AI Industry & Broader Trends",
  space: "Space Data Centers",
  standards: "Networking Standards & Innovations",
};

const STALE_HOURS = 20;
const LAST_REFRESH_KEY = "backbone:lastRefreshAt";

let stories = [];
let activeBucket = "all";
let activeTag = "all";
let openId = null;
let pileOpen = false;
let refreshing = false;

const tabsEl = document.getElementById("tabs");
const feedEl = document.getElementById("feed");
const stampEl = document.getElementById("stamp");
const feedNoteEl = document.getElementById("feed-note");
const refreshBtn = document.getElementById("refresh-btn");
const refreshLabel = document.getElementById("refresh-label");
const progressFill = document.getElementById("progress-fill");
const menuBtn = document.getElementById("menu-btn");
const menuEl = document.getElementById("menu");
const tagFilterEl = document.getElementById("tag-filter");
const submitUrl = document.getElementById("submit-url");
const submitBucket = document.getElementById("submit-bucket");
const submitNote = document.getElementById("submit-note");
const submitGo = document.getElementById("submit-go");
const submitStatus = document.getElementById("submit-status");
const pullEl = document.getElementById("pull");

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function apiHeaders() {
  const h = { "Content-Type": "application/json" };
  if (REFRESH_SECRET) h["x-refresh-secret"] = REFRESH_SECRET;
  return h;
}

function dayOf(s) {
  return s.published_at || s.found_on;
}

function unreadCount(bucketId) {
  return stories.filter((s) =>
    (bucketId === "all" || s.bucket === bucketId) && !s.is_read && !s.dismissed).length;
}

function renderTabs() {
  tabsEl.innerHTML = "";
  BUCKETS.forEach((b) => {
    const n = unreadCount(b.id);
    const btn = document.createElement("button");
    btn.className = "tab" + (b.id === activeBucket ? " active" : "");
    btn.innerHTML = `${esc(b.label)}${n > 0 ? `<span class="count">${n}</span>` : ""}<span class="mark"></span>`;
    btn.addEventListener("click", () => {
      activeBucket = b.id;
      openId = null;
      renderTabs();
      renderFeed();
    });
    tabsEl.appendChild(btn);
  });
}

function relativeDay(dateStr) {
  if (!dateStr) return "Date unknown";
  const d = new Date(dateStr + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - d) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Yesterday";
  if (diff < 0) return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  if (diff < 7) return `${diff} days ago`;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function formatDay(dateStr) {
  if (!dateStr) return "Undated";
  const d = new Date(dateStr + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - d) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Yesterday";
  return d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
}

function cardMarkup(s) {
  return `
    <div class="card-meta">
      <span class="dot ${s.is_read ? "read" : ""}"></span>
      <span class="kicker">${esc(s.tag)}</span>
      <span class="when">${relativeDay(dayOf(s))}</span>
    </div>
    <h3 class="card-title">${esc(s.headline)}</h3>
    <p class="card-teaser">${esc(s.teaser)}</p>
    <div class="card-body">
      <p class="summary ${s.summary ? "" : "pending"}">${s.summary ? esc(s.summary) : "Writing summary…"}</p>
      <div class="actions">
        <a class="link" href="${esc(s.url)}" target="_blank" rel="noopener">Read source →</a>
        <button class="text-btn js-dismiss">${s.dismissed ? "Undo not relevant" : "Not relevant"}</button>
      </div>
    </div>
    <div class="card-source">
      <span>${esc(s.source)}</span>
      ${s.is_blog ? '<span class="badge">Blog post</span>' : ""}
      ${s.is_manual ? '<span class="badge">Added by you</span>' : ""}
    </div>`;
}

function buildCard(s) {
  const el = document.createElement("article");
  el.className = "card" + (openId === s.id ? " open" : "") + (s.dismissed ? " dismissed" : "");
  el.innerHTML = cardMarkup(s);

  el.querySelector(".js-dismiss").addEventListener("click", (e) => {
    e.stopPropagation();
    toggleDismissed(s);
  });

  el.addEventListener("click", (e) => {
    if (e.target.tagName === "A" || e.target.tagName === "BUTTON") return;
    const opening = openId !== s.id;
    openId = opening ? s.id : null;
    renderFeed();
    if (opening) {
      if (!s.summary) ensureSummary(s);
      if (!s.is_read) markRead(s);
    }
  });

  return el;
}

function renderFeed() {
  let list = stories.filter((s) => activeBucket === "all" || s.bucket === activeBucket);
  if (activeTag !== "all") list = list.filter((s) => s.tag === activeTag);

  const unread = list.filter((s) => !s.is_read);
  const read = list.filter((s) => s.is_read);

  feedNoteEl.textContent = `${unread.length} unread · ${read.length} read`
    + (activeBucket === "all" ? "" : ` · ${FULL_NAMES[activeBucket]}`);

  feedEl.innerHTML = "";

  if (!list.length) {
    feedEl.innerHTML = `<div class="empty">Nothing in this beat yet. Refresh to check the feeds, or add a story it missed from the ⋯ menu.</div>`;
    return;
  }

  const groups = new Map();
  unread.forEach((s) => {
    const k = dayOf(s);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(s);
  });

  [...groups.entries()]
    .sort((a, b) => (a[0] < b[0] ? 1 : -1))
    .forEach(([day, items]) => {
      const block = document.createElement("div");
      block.className = "day-block";
      const label = document.createElement("div");
      label.className = "day";
      label.textContent = formatDay(day);
      const grid = document.createElement("div");
      grid.className = "grid";
      items.forEach((s) => grid.appendChild(buildCard(s)));
      block.append(label, grid);
      feedEl.appendChild(block);
    });

  if (read.length) {
    const pile = document.createElement("div");
    pile.className = "pile";
    const toggle = document.createElement("button");
    toggle.className = "pile-toggle";
    toggle.textContent = `${pileOpen ? "▾" : "▸"} Already read (${read.length})`;
    const grid = document.createElement("div");
    grid.className = "pile-grid" + (pileOpen ? " open" : "");

    read
      .sort((a, b) => (dayOf(a) < dayOf(b) ? 1 : -1))
      .forEach((s) => {
        if (openId === s.id) {
          grid.appendChild(buildCard(s));
          return;
        }
        const el = document.createElement("div");
        el.className = "pile-card";
        el.innerHTML = `
          <div class="pile-meta">${esc(s.source)} · ${relativeDay(dayOf(s))}</div>
          <div class="pile-title">${esc(s.headline)}</div>`;
        el.addEventListener("click", () => {
          openId = s.id;
          renderFeed();
          if (!s.summary) ensureSummary(s);
        });
        grid.appendChild(el);
      });

    toggle.addEventListener("click", () => {
      pileOpen = !pileOpen;
      renderFeed();
    });

    pile.append(toggle, grid);
    feedEl.appendChild(pile);
  }
}

async function ensureSummary(story) {
  try {
    const res = await fetch("/api/summarize", {
      method: "POST", headers: apiHeaders(),
      body: JSON.stringify({ story_id: story.id }),
    });
    const result = await res.json();
    if (!res.ok || !result.ok) throw new Error(result.error || "Summary failed");
    story.summary = result.summary;
  } catch (err) {
    console.error(err);
    story.summary = "Couldn't write a summary — open the source instead.";
  }
  renderFeed();
}

async function markRead(story) {
  story.is_read = true;
  renderTabs();
  const { error } = await supabase.rpc("mark_story_read", { story_id: story.id });
  if (error) console.error("Failed to mark read:", error);
}

async function toggleDismissed(story) {
  const next = !story.dismissed;
  story.dismissed = next;
  renderTabs();
  renderFeed();
  try {
    const res = await fetch("/api/feedback", {
      method: "POST", headers: apiHeaders(),
      body: JSON.stringify({ story_id: story.id, dismissed: next }),
    });
    const result = await res.json();
    if (!res.ok || !result.ok) throw new Error(result.error || "Feedback failed");
  } catch (err) {
    console.error(err);
    story.dismissed = !next;
    renderTabs();
    renderFeed();
  }
}

async function loadStories() {
  const { data, error } = await supabase
    .from("stories")
    .select("*")
    .order("published_at", { ascending: false, nullsFirst: false })
    .order("created_at", { ascending: false });

  if (error) {
    feedEl.innerHTML = `<div class="empty">Couldn't load stories — check the Supabase keys in index.html.</div>`;
    console.error(error);
    return;
  }

  stories = data || [];
  renderTabs();
  renderFeed();

  const last = Number(localStorage.getItem(LAST_REFRESH_KEY) || 0);
  if (last) {
    stampEl.textContent = "Checked " + new Date(last).toLocaleString(undefined, {
      month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
    });
  } else if (stories.length) {
    stampEl.textContent = "Latest " + formatDay(dayOf(stories[0]));
  }
}

// Refresh runs one beat per call — Hobby's 60s cap and the free-tier
// tokens-per-minute ceiling both rule out doing all seven at once.
async function triggerRefresh() {
  if (refreshing) return;
  refreshing = true;
  refreshBtn.disabled = true;
  refreshBtn.classList.add("loading");
  progressFill.style.width = "0%";

  let cursor = 0;
  let inserted = 0;
  let total = BUCKETS.length - 1;
  const problems = [];

  try {
    while (cursor !== null) {
      refreshLabel.textContent = `${Math.min(cursor + 1, total)} of ${total}`;
      const res = await fetch(`/api/refresh?cursor=${cursor}`, { method: "POST", headers: apiHeaders() });
      const result = await res.json();
      if (!res.ok || !result.ok) throw new Error(result.error || "Refresh failed");

      inserted += result.stories_inserted || 0;
      if (result.total_buckets) total = result.total_buckets;
      if (result.feed_health?.length) problems.push(...result.feed_health);

      progressFill.style.width = result.done ? "100%" : `${Math.round(((result.next || 0) / total) * 100)}%`;
      cursor = result.done ? null : result.next;
    }

    localStorage.setItem(LAST_REFRESH_KEY, String(Date.now()));
    await loadStories();
    refreshLabel.textContent = inserted ? `${inserted} new` : "Nothing new";

    if (problems.length) {
      console.warn("Feeds failing or returning nothing:", problems);
      feedNoteEl.textContent += ` · ${problems.length} feed${problems.length > 1 ? "s" : ""} need attention (see console)`;
    }
  } catch (err) {
    console.error(err);
    refreshLabel.textContent = "Failed";
    feedNoteEl.textContent = String(err.message || err).slice(0, 140);
  } finally {
    refreshing = false;
    refreshBtn.classList.remove("loading");
    refreshBtn.disabled = false;
    setTimeout(() => {
      refreshLabel.textContent = "Refresh";
      progressFill.style.width = "0%";
    }, 3500);
  }
}

async function submitStory() {
  const url = submitUrl.value.trim();
  if (!/^https?:\/\//i.test(url)) {
    submitStatus.textContent = "Needs a full http(s) URL.";
    submitStatus.classList.add("err");
    return;
  }
  submitGo.disabled = true;
  submitStatus.classList.remove("err");
  submitStatus.textContent = "Reading the page…";

  try {
    const res = await fetch("/api/submit", {
      method: "POST", headers: apiHeaders(),
      body: JSON.stringify({ url, bucket: submitBucket.value, note: submitNote.value.trim() }),
    });
    const result = await res.json();
    if (!res.ok || !result.ok) throw new Error(result.error || "Submit failed");

    submitStatus.textContent = result.already_present
      ? "Already in your feed — recorded as a preference."
      : `Added.${result.warning ? " " + result.warning + "." : ""} This source is now trusted.`;
    submitUrl.value = "";
    submitNote.value = "";
    await loadStories();
  } catch (err) {
    console.error(err);
    submitStatus.textContent = String(err.message || err).slice(0, 140);
    submitStatus.classList.add("err");
  } finally {
    submitGo.disabled = false;
  }
}

// --- wiring ----------------------------------------------------------------
BUCKETS.filter((b) => b.id !== "all").forEach((b) => {
  const opt = document.createElement("option");
  opt.value = b.id;
  opt.textContent = FULL_NAMES[b.id];
  submitBucket.appendChild(opt);
});

refreshBtn.addEventListener("click", triggerRefresh);
submitGo.addEventListener("click", submitStory);
submitUrl.addEventListener("keydown", (e) => { if (e.key === "Enter") submitStory(); });

menuBtn.addEventListener("click", () => {
  const open = menuEl.classList.toggle("open");
  menuBtn.setAttribute("aria-expanded", String(open));
});

tagFilterEl.addEventListener("change", (e) => {
  activeTag = e.target.value;
  openId = null;
  renderFeed();
});

// Pull to refresh — phone only; the sticky bar covers the laptop.
let pullStart = null;
window.addEventListener("touchstart", (e) => {
  pullStart = window.scrollY <= 0 ? e.touches[0].clientY : null;
}, { passive: true });
window.addEventListener("touchmove", (e) => {
  if (pullStart === null || refreshing) return;
  const delta = e.touches[0].clientY - pullStart;
  pullEl.classList.toggle("show", delta > 70);
}, { passive: true });
window.addEventListener("touchend", () => {
  if (pullEl.classList.contains("show")) triggerRefresh();
  pullEl.classList.remove("show");
  pullStart = null;
}, { passive: true });

await loadStories();

// Hobby crons fire once a day and can't finish the whole loop, so the page
// keeps itself current when you open it.
const last = Number(localStorage.getItem(LAST_REFRESH_KEY) || 0);
if (Date.now() - last > STALE_HOURS * 3600 * 1000) triggerRefresh();
</script>
