<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>NewsFeed</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Nocturne tokens */
  :root{
    --color-bg:#161826;
    --color-surface:#232532;
    --color-text:#e4e7f5;
    --color-accent:#9184d9;
    --color-divider:color-mix(in srgb, #e9e9ed 16%, transparent);

    --color-neutral-300:#cfd3e5;
    --color-neutral-400:#b2b6ca;
    --color-neutral-500:#9397ab;
    --color-neutral-600:#75798c;
    --color-neutral-700:#595d6c;
    --color-neutral-800:#3f424d;
    --color-neutral-900:#292b31;

    --color-accent-300:#d2cefd;
    --color-accent-400:#b5abfc;
    --color-accent-700:#5d5294;

    --font-heading:"Inter", system-ui, sans-serif;
    --font-body:"Inter", system-ui, sans-serif;

    --radius-sm:4px;
    --radius-md:8px;

    --shadow-sm:0 0 0 1px #3f424d;
    --shadow-md:0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);}
  body{min-height:100vh;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;}
  ::selection{background:color-mix(in srgb, var(--color-accent) 32%, transparent);}
  h1,h2,h3{font-family:var(--font-heading);font-weight:500;margin:0;}
  a{color:var(--color-accent-300);text-underline-offset:3px;}
  a:hover{color:var(--color-accent-400);}
  button{font-family:var(--font-body);}
  :focus{outline:none;}
  :focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;}

  /* ---------- sticky chrome ---------- */
  .chrome{position:sticky;top:0;z-index:20;background:var(--color-bg);}
  .bar{display:flex;align-items:center;gap:14px;padding:16px 32px 4px;}
  .brand{font-family:var(--font-heading);font-weight:500;font-size:15px;letter-spacing:.01em;margin-right:auto;}
  .stamp{font-size:12px;color:var(--color-neutral-600);white-space:nowrap;}

  .menu-btn{
    background:transparent;border:1px solid var(--color-divider);color:var(--color-neutral-400);
    font-family:var(--font-heading);font-weight:500;font-size:12.5px;
    padding:7px 13px;border-radius:var(--radius-sm);cursor:pointer;flex:none;
    display:flex;align-items:center;gap:7px;transition:border-color .18s ease,color .18s ease;
  }
  .menu-btn:hover{border-color:var(--color-accent);color:var(--color-accent-300);}
  .menu-btn[aria-expanded="true"]{border-color:var(--color-accent);color:var(--color-accent-300);}
  .menu-dot{width:6px;height:6px;border-radius:6px;background:var(--color-accent);display:none;}
  .menu-dot.show{display:block;}

  .refresh-btn{
    background:transparent;border:1px solid var(--color-accent);color:var(--color-accent-300);
    font-family:var(--font-heading);font-weight:500;font-size:12.5px;
    padding:7px 14px;border-radius:var(--radius-sm);cursor:pointer;flex:none;
    display:flex;align-items:center;gap:7px;transition:background .18s ease;
  }
  .refresh-btn:hover{background:color-mix(in srgb, var(--color-accent) 14%, transparent);}
  .refresh-btn:active{border-color:var(--color-accent-400);}
  .refresh-btn:disabled{opacity:.45;cursor:default;}
  .spin{
    width:11px;height:11px;border-radius:50%;flex:none;
    border:1.5px solid color-mix(in srgb, var(--color-accent) 35%, transparent);
    border-top-color:var(--color-accent-300);
    animation:spin .7s linear infinite;display:none;
  }
  .refresh-btn.loading .spin{display:block;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .rule{height:1px;background:linear-gradient(90deg,transparent 0,var(--color-divider) 48px,var(--color-divider) calc(100% - 48px),transparent 100%);}

  .progress{height:3px;background:transparent;overflow:hidden;transition:background .2s ease;}
  .progress.active{background:var(--color-neutral-900);}
  .progress .fill{
    height:100%;width:0;background:var(--color-accent);transition:width .3s ease;
    box-shadow:0 0 8px color-mix(in srgb, var(--color-accent) 70%, transparent);
  }

  /* ---------- menu ---------- */
  .menu{
    display:none;padding:20px 32px 24px;border-bottom:1px solid var(--color-divider);
    background:var(--color-bg);
  }
  .menu.open{display:block;}
  .menu-grid{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start;}
  .menu-block{display:flex;flex-direction:column;gap:8px;min-width:260px;flex:1;}
  .menu-label{font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600);}
  .input,.select{
    width:100%;min-height:34px;padding:7px 10px;font:inherit;font-size:13.5px;
    color:var(--color-text);background:var(--color-surface);caret-color:var(--color-accent);
    border:1px solid var(--color-divider);border-radius:var(--radius-sm);
  }
  .input:hover,.select:hover{border-color:var(--color-neutral-700);}
  .input:focus-visible,.select:focus-visible{border-color:var(--color-accent);outline-offset:0;}
  .input::placeholder{color:var(--color-neutral-600);}
  .row{display:flex;gap:8px;}
  .ghost-btn{
    background:transparent;border:1px solid var(--color-divider);color:var(--color-neutral-300);
    font-family:var(--font-heading);font-weight:500;font-size:12.5px;
    padding:7px 14px;border-radius:var(--radius-sm);cursor:pointer;white-space:nowrap;
    transition:border-color .18s ease,color .18s ease;
  }
  .ghost-btn:hover{border-color:var(--color-accent);color:var(--color-accent-300);}
  .ghost-btn:disabled{opacity:.45;cursor:default;}
  .note{font-size:11.5px;line-height:1.5;color:var(--color-neutral-600);}
  .note.err{color:var(--color-accent-300);}

  /* ---------- layout: sidebar + feed ---------- */
  .layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px;max-width:1160px;margin:0 auto;padding:28px 32px 110px;}
  .side{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:2px;}
  .nav-item{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:transparent;border:0;border-radius:999px;cursor:pointer;
    font-family:var(--font-heading);font-weight:500;font-size:14px;
    color:var(--color-neutral-400);padding:9px 16px;transition:background .18s ease,color .18s ease;
  }
  .nav-item:hover{background:color-mix(in srgb, var(--color-neutral-700) 35%, transparent);color:var(--color-text);}
  .nav-item.active{background:color-mix(in srgb, var(--color-accent) 20%, transparent);color:var(--color-accent-300);}
  .nav-item svg{width:16px;height:16px;flex:none;display:block;}
  .nav-swatch{width:9px;height:9px;border-radius:3px;flex:none;margin:0 3.5px;}
  .nav-item .count{margin-left:auto;font-size:12px;color:var(--color-neutral-500);}
  .nav-item.active .count{color:var(--color-accent-300);}
  .nav-sep{height:1px;background:var(--color-divider);margin:10px 16px;}

  .feed-head{margin:0 0 22px;}
  .feed-title{font-size:24px;letter-spacing:-.02em;}
  .feed-sub{font-size:13px;color:var(--color-neutral-600);margin-top:4px;}

  /* ---------- story clusters ---------- */
  .cluster{
    background:var(--color-surface);border-radius:var(--radius-md);padding:20px 22px;margin-bottom:16px;
    box-shadow:var(--shadow-sm);transition:box-shadow .18s ease;
  }
  .cluster:hover{box-shadow:var(--shadow-md);}
  .cluster.faded{opacity:.72;}
  .cluster.faded:hover{opacity:1;}

  .story{cursor:pointer;}
  .story + .story{border-top:1px solid var(--color-divider);margin-top:14px;padding-top:14px;}
  .src-line{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--color-neutral-400);min-width:0;}
  .avatar{
    width:18px;height:18px;border-radius:4px;flex:none;display:inline-flex;align-items:center;justify-content:center;
    font-size:10.5px;font-weight:600;color:#161826;
  }
  .src-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22em;}
  .when{color:var(--color-neutral-600);white-space:nowrap;}
  .dot{width:6px;height:6px;border-radius:6px;background:var(--color-accent);flex:none;}
  .trail{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none;}
  .beat-pill{font-size:11px;padding:2px 9px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb, var(--beat) 16%, transparent);color:var(--beat);}

  .kicker{font-size:10px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--color-accent-300);white-space:nowrap;}
  .kicker[data-tag="Product Launch"]{color:#7dd3fc;}
  .kicker[data-tag="Earnings"]{color:#86efac;}
  .kicker[data-tag="Partnership"]{color:#fcd34d;}
  .kicker[data-tag="AI Fabric"]{color:#c4b5fd;}
  .kicker[data-tag="Executive Move"]{color:#fda4af;}
  .kicker[data-tag="Industry Standard"]{color:#67e8f9;}
  .kicker[data-tag="Other"]{display:none;}
  .badge{color:var(--color-accent-300);font-style:italic;white-space:nowrap;}

  .story-title{font-family:var(--font-heading);font-weight:500;font-size:15.5px;line-height:1.32;letter-spacing:-.008em;margin:7px 0 0;}
  .story.lead .story-title{font-size:20px;line-height:1.25;letter-spacing:-.014em;}
  .story:hover .story-title{color:var(--color-accent-300);}
  .lead-teaser{font-size:14px;line-height:1.5;margin:8px 0 0;color:var(--color-neutral-500);}
  .story.read .story-title{color:var(--color-neutral-500);}
  .story.dismissed{opacity:.4;}
  .story.dismissed .story-title{text-decoration:line-through;text-decoration-thickness:1px;}

  .save-btn{
    background:transparent;border:0;padding:0;cursor:pointer;flex:none;
    color:var(--color-neutral-600);display:flex;align-items:center;transition:color .18s ease;
  }
  .save-btn svg{width:16px;height:16px;display:block;}
  .save-btn:hover{color:var(--color-accent-300);}
  .save-btn.on{color:var(--color-accent);}

  .story-body{display:none;padding-top:14px;margin-top:14px;border-top:1px solid var(--color-divider);animation:fade .22s ease;cursor:default;}
  .story.open .story-body{display:block;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .summary{font-size:14px;line-height:1.65;margin:0 0 16px;color:var(--color-neutral-300);max-width:62em;}
  .summary.pending{color:var(--color-neutral-600);font-style:italic;}
  .summary.pending::before{
    content:"";display:inline-block;width:9px;height:9px;margin-right:8px;vertical-align:-1px;
    border-radius:50%;border:1.5px solid color-mix(in srgb, var(--color-accent) 35%, transparent);
    border-top-color:var(--color-accent-300);animation:spin .7s linear infinite;
  }
  .actions{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
  .link{font-family:var(--font-heading);font-weight:500;font-size:12.5px;text-decoration:none;}
  .text-btn{background:transparent;border:0;padding:0;font-size:12.5px;color:var(--color-neutral-600);cursor:pointer;transition:color .18s ease;}
  .text-btn:hover{color:var(--color-accent-300);}

  .coverage{
    display:inline-flex;align-items:center;gap:7px;margin-top:16px;padding:7px 14px;
    background:transparent;border:1px solid var(--color-divider);border-radius:999px;cursor:pointer;
    font-family:var(--font-heading);font-weight:500;font-size:12.5px;color:var(--color-accent-300);
    transition:border-color .18s ease;
  }
  .coverage:hover{border-color:var(--color-accent);}
  .coverage svg{width:14px;height:14px;display:block;}

  /* ---------- read pile ---------- */
  .pile{border-top:1px solid var(--color-divider);padding-top:24px;margin-top:28px;}
  .pile-toggle{background:transparent;border:0;padding:0;margin-bottom:16px;font-family:var(--font-heading);font-weight:500;font-size:12.5px;color:var(--color-neutral-500);cursor:pointer;transition:color .18s ease;}
  .pile-toggle:hover{color:var(--color-accent-300);}

  .empty{padding:60px 0;color:var(--color-neutral-600);font-size:14px;max-width:34em;display:flex;gap:14px;align-items:flex-start;}
  .empty svg{width:22px;height:22px;flex:none;margin-top:2px;color:var(--color-neutral-700);}

  /* pull-to-refresh indicator */
  .pull{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:30;}
  .pull span{
    font-size:11.5px;color:var(--color-accent-300);background:var(--color-surface);
    border:1px solid var(--color-divider);border-top:0;
    border-radius:0 0 var(--radius-md) var(--radius-md);
    padding:5px 14px;transform:translateY(-100%);transition:transform .2s ease;
  }
  .pull.show span{transform:translateY(0);}

  @media (max-width:820px){
    .bar{padding:14px 18px 4px;}
    .menu{padding:18px;}
    .stamp{display:none;}
    .layout{grid-template-columns:minmax(0,1fr);gap:18px;padding:16px 18px 90px;}
    .side{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none;}
    .side::-webkit-scrollbar{display:none;}
    .nav-item{width:auto;flex:none;padding:7px 14px;font-size:13px;border:1px solid var(--color-divider);}
    .nav-item.active{border-color:transparent;}
    .nav-item .count{margin-left:2px;}
    .nav-sep{display:none;}
    .feed-title{font-size:20px;}
    .cluster{padding:16px;}
    .story.lead .story-title{font-size:18px;}
    .src-name{max-width:12em;}
    .src-line .kicker{display:none;}   /* publisher name wins the narrow line; filter by tag from the menu */
  }
</style>
</head>

<div class="pull" id="pull"><span>Release to refresh</span></div>

<div class="chrome">
  <div class="bar">
    <span class="brand">NewsFeed</span>
    <span class="stamp" id="stamp">—</span>
    <button class="refresh-btn" id="refresh-btn"><span class="spin"></span><span id="refresh-label">Refresh</span></button>
    <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-label="Filters and add a story">
      <span>Filters</span><span class="menu-dot" id="menu-dot"></span>
    </button>
  </div>
  <div class="rule"></div>
  <div class="progress" id="progress-track"><div class="fill" id="progress-fill"></div></div>
</div>

<div class="menu" id="menu">
  <div class="menu-grid">
    <div class="menu-block">
      <span class="menu-label">Add a story it missed</span>
      <input class="input" id="submit-url" type="url" placeholder="Paste article URL">
      <div class="row">
        <select class="select" id="submit-bucket"></select>
        <button class="ghost-btn" id="submit-go">Add</button>
      </div>
      <input class="input" id="submit-note" type="text" placeholder="Note (optional)">
      <div class="note" id="submit-status">The source becomes trusted and shapes future picks.</div>
    </div>
    <div class="menu-block">
      <span class="menu-label">Filter by tag</span>
      <select class="select" id="tag-filter">
        <option value="all">All tags</option>
        <option value="Product Launch">Product Launch</option>
        <option value="Earnings">Earnings</option>
        <option value="Partnership">Partnership</option>
        <option value="AI Fabric">AI Fabric</option>
        <option value="Executive Move">Executive Move</option>
        <option value="Industry Standard">Industry Standard</option>
        <option value="Other">Other</option>
      </select>
      <div class="note" id="feed-note"></div>
    </div>
  </div>
</div>

<div class="layout">
  <nav class="side" id="side" aria-label="Beats"></nav>
  <main>
    <div class="feed-head">
      <h1 class="feed-title" id="feed-title">Top stories</h1>
      <div class="feed-sub" id="feed-sub"></div>
    </div>
    <div id="feed"></div>
  </main>
</div>

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function apiHeaders() {
  const h = { "Content-Type": "application/json" };
  if (REFRESH_SECRET) h["x-refresh-secret"] = REFRESH_SECRET;
  return h;
}

function dayOf(s) {
  return s.published_at || s.found_on;
}

function unreadCount(bucketId) {
  return stories.filter((s) =>
    (bucketId === "all" || s.bucket === bucketId) && !s.is_read && !s.dismissed).length;
}

const BEAT_COLORS = {
  hpe: "#86efac", cisco: "#7dd3fc", arista: "#fdba74", silicon: "#c4b5fd",
  ai_industry: "#fcd34d", space: "#67e8f9", standards: "#fda4af",
};

function navItem(id, inner, active) {
  const btn = document.createElement("button");
  btn.className = "nav-item" + (active ? " active" : "");
  btn.innerHTML = inner;
  btn.addEventListener("click", () => {
    activeBucket = id;
    openId = null;
    renderNav();
    renderFeed();
    window.scrollTo({ top: 0 });
  });
  return btn;
}

function renderNav() {
  sideEl.innerHTML = "";
  const count = (id) => {
    const n = unreadCount(id);
    return n > 0 ? `<span class="count">${n}</span>` : "";
  };
  const sep = () => Object.assign(document.createElement("div"), { className: "nav-sep" });

  sideEl.appendChild(navItem("all", `${NEWS_ICON}<span>Top stories</span>${count("all")}`, activeBucket === "all"));
  sideEl.appendChild(sep());
  BUCKETS.filter((b) => b.id !== "all").forEach((b) => {
    sideEl.appendChild(navItem(b.id,
      `<span class="nav-swatch" style="background:${BEAT_COLORS[b.id]}"></span><span>${esc(b.label)}</span>${count(b.id)}`,
      activeBucket === b.id));
  });
  sideEl.appendChild(sep());
  sideEl.appendChild(navItem("saved", `${BOOKMARK_OUTLINE}<span>Saved</span>`, activeBucket === "saved"));
}

function renderHead() {
  feedTitleEl.textContent = activeBucket === "all" ? "Top stories"
    : activeBucket === "saved" ? "Saved"
    : FULL_NAMES[activeBucket];
  feedSubEl.textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
}

function relativeDay(dateStr) {
  if (!dateStr) return "Date unknown";
  const d = new Date(dateStr + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - d) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Yesterday";
  if (diff < 0) return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  if (diff < 7) return `${diff} days ago`;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function formatDay(dateStr) {
  if (!dateStr) return "Undated";
  const d = new Date(dateStr + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - d) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Yesterday";
  return d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
}

// Publisher chip: first letter on a color derived from the name, so each
// outlet keeps the same color everywhere.
function avatarFor(source) {
  const name = String(source || "?").replace(/^the\s+/i, "");
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `<span class="avatar" style="background:hsl(${h} 55% 74%)">${esc(name[0].toUpperCase())}</span>`;
}

// ---------------------------------------------------------------------------
// Full coverage: stories from different outlets about one event share most of
// their distinctive headline words. Mirrors sameStory() in api/refresh.js.
// ---------------------------------------------------------------------------
const STOP = new Set(("a an the and or of for to in on at by with from as is are was were be been " +
  "its it this that these those new news says said report reports will can could may " +
  "into onto over under after about than their they them what when where which while have has " +
  "data center centers centre network networks networking").split(" "));

function headlineTerms(title) {
  return [...new Set(String(title || "").toLowerCase()
    .replace(/[^a-z0-9\s-]/g, " ")
    .split(/\s+/)
    .filter((w) => w.length > 3 && !STOP.has(w))
    .map((w) => w.replace(/(es|s)$/, "")))];
}

function sameEvent(a, b) {
  const B = new Set(b);
  const shared = a.filter((t) => B.has(t)).length;
  const ratio = shared / Math.min(a.length, b.length);
  return (shared >= 3 && ratio >= 0.5) || (shared >= 2 && ratio >= 0.75);
}

// Input is newest-first, so each cluster's first story is its newest.
function clusterStories(list) {
  const clusters = [];
  for (const s of list) {
    const terms = headlineTerms(s.headline);
    const home = clusters.find((c) => c.terms.some((t) => sameEvent(terms, t)));
    if (home) {
      home.items.push(s);
      home.terms.push(terms);
    } else {
      clusters.push({ items: [s], terms: [terms] });
    }
  }
  return clusters;
}

function storyEl(s, { lead = false, showBeat = false } = {}) {
  const el = document.createElement("div");
  const isOpen = openId === s.id;
  el.className = "story" + (lead ? " lead" : "") + (isOpen ? " open" : "")
    + (s.is_read && !isOpen ? " read" : "") + (s.dismissed ? " dismissed" : "");
  el.dataset.storyId = s.id;
  const beat = BUCKETS.find((b) => b.id === s.bucket);
  el.innerHTML = `
    <div class="src-line">
      ${avatarFor(s.source)}
      <span class="src-name">${esc(s.source)}</span>
      <span class="when">· ${relativeDay(dayOf(s))}</span>
      ${s.is_read ? "" : '<span class="dot" title="Unread"></span>'}
      <span class="kicker" data-tag="${esc(s.tag)}">${esc(s.tag)}</span>
      ${s.is_blog ? '<span class="badge">Blog post</span>' : ""}
      ${s.is_manual ? '<span class="badge">Added by you</span>' : ""}
      <span class="trail">
        ${showBeat && beat ? `<span class="beat-pill" style="--beat:${BEAT_COLORS[s.bucket]}">${esc(beat.label)}</span>` : ""}
        <button class="save-btn js-save ${s.saved ? "on" : ""}" aria-pressed="${s.saved ? "true" : "false"}" aria-label="${s.saved ? "Remove from saved" : "Save article"}" title="${s.saved ? "Remove from saved" : "Save"}">${s.saved ? BOOKMARK_FILL : BOOKMARK_OUTLINE}</button>
      </span>
    </div>
    <h3 class="story-title">${esc(s.headline)}</h3>
    ${lead && s.teaser && s.teaser !== s.headline ? `<p class="lead-teaser">${esc(s.teaser)}</p>` : ""}
    <div class="story-body">
      <p class="summary ${s.summary ? "" : "pending"}">${s.summary ? esc(s.summary) : "Writing summary…"}</p>
      <div class="actions">
        <a class="link" href="${esc(s.url)}" target="_blank" rel="noopener">Read source →</a>
        <button class="text-btn js-dismiss">${s.dismissed ? "Undo not relevant" : "Not relevant"}</button>
      </div>
    </div>`;

  el.querySelector(".js-dismiss").addEventListener("click", (e) => {
    e.stopPropagation();
    toggleDismissed(s);
  });

  el.querySelector(".js-save").addEventListener("click", (e) => {
    e.stopPropagation();
    toggleSaved(s);
  });

  el.addEventListener("click", (e) => {
    if (e.target.closest("a, button, .story-body")) return;
    const opening = openId !== s.id;
    if (opening) openWasRead = s.is_read;
    openId = opening ? s.id : null;
    renderFeed();
    if (opening) {
      if (!s.summary) ensureSummary(s);
      if (!s.is_read) markRead(s);
      document.querySelector(`[data-story-id="${s.id}"]`)
        ?.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  });

  return el;
}

const RELATED_SHOWN = 3;

function clusterEl(cluster, { showBeat = false, faded = false } = {}) {
  const [lead, ...rest] = cluster.items;
  const el = document.createElement("article");
  el.className = "cluster" + (faded ? " faded" : "");
  el.appendChild(storyEl(lead, { lead: true, showBeat }));

  const expanded = expandedClusters.has(lead.id);
  rest.forEach((s, i) => {
    // An open story stays visible even when coverage is collapsed.
    if (expanded || i < RELATED_SHOWN || s.id === openId) el.appendChild(storyEl(s));
  });

  if (rest.length > RELATED_SHOWN) {
    const outlets = new Set(cluster.items.map((s) => s.source)).size;
    const btn = document.createElement("button");
    btn.className = "coverage";
    btn.innerHTML = expanded
      ? `${STACK_ICON}<span>Show less</span>`
      : `${STACK_ICON}<span>Full coverage · ${cluster.items.length} stories from ${outlets} outlets</span>`;
    btn.addEventListener("click", () => {
      if (expanded) expandedClusters.delete(lead.id);
      else expandedClusters.add(lead.id);
      renderFeed();
    });
    el.appendChild(btn);
  }
  return el;
}

// Saved is its own view: no grouping, no read pile, ordered by when you
// saved it rather than when it was published.
function renderSaved() {
  const list = stories
    .filter((s) => s.saved)
    .sort((a, b) => String(b.saved_at || "").localeCompare(String(a.saved_at || "")));

  feedNoteEl.textContent = `${list.length} saved`;
  feedSubEl.textContent = `${list.length} saved, newest save first`;
  feedEl.innerHTML = "";

  if (!list.length) {
    feedEl.innerHTML = `<div class="empty">${BOOKMARK_OUTLINE}<span>Nothing saved yet. Tap the bookmark on any story and it collects here, newest save first.</span></div>`;
    return;
  }

  list.forEach((s) => feedEl.appendChild(clusterEl({ items: [s] }, { showBeat: true, faded: s.is_read })));
}

function renderFeed() {
  renderHead();
  if (activeBucket === "saved") return renderSaved();

  let list = stories.filter((s) => activeBucket === "all" || s.bucket === activeBucket);
  if (activeTag !== "all") list = list.filter((s) => s.tag === activeTag);

  const pinnedUp = (s) => s.id === openId && !openWasRead;
  const clusters = clusterStories(list);
  const fresh = clusters.filter((c) => c.items.some((s) => !s.is_read || pinnedUp(s)));
  const read = clusters.filter((c) => !fresh.includes(c));

  const unreadN = list.filter((s) => !s.is_read).length;
  feedNoteEl.textContent = `${unreadN} unread · ${list.length - unreadN} read`
    + (activeBucket === "all" ? "" : ` · ${FULL_NAMES[activeBucket]}`);
  feedSubEl.textContent += unreadN ? ` · ${unreadN} unread` : " · all caught up";

  feedEl.innerHTML = "";

  if (!list.length) {
    feedEl.innerHTML = `<div class="empty">${INFO_ICON}<span>Nothing in this beat yet. Refresh to check the feeds, or add a story it missed from the Filters menu.</span></div>`;
    return;
  }

  const showBeat = activeBucket === "all";
  fresh.forEach((c) => feedEl.appendChild(clusterEl(c, { showBeat })));

  if (read.length) {
    const pile = document.createElement("div");
    pile.className = "pile";
    const toggle = document.createElement("button");
    toggle.className = "pile-toggle";
    toggle.textContent = `${pileOpen ? "▾" : "▸"} Already read (${read.length})`;
    toggle.addEventListener("click", () => {
      pileOpen = !pileOpen;
      renderFeed();
    });
    pile.appendChild(toggle);
    if (pileOpen || read.some((c) => c.items.some((s) => s.id === openId))) {
      read.forEach((c) => pile.appendChild(clusterEl(c, { showBeat, faded: true })));
    }
    feedEl.appendChild(pile);
  }
}

async function ensureSummary(story) {
  try {
    const res = await fetch("/api/summarize", {
      method: "POST", headers: apiHeaders(),
      body: JSON.stringify({ story_id: story.id }),
    });
    const result = await res.json();
    if (!res.ok || !result.ok) throw new Error(result.error || "Summary failed");
    story.summary = result.summary;
  } catch (err) {
    console.error(err);
    story.summary = "Couldn't write a summary — open the source instead.";
  }
  renderFeed();
}

async function markRead(story) {
  story.is_read = true;
  renderNav();
  const { error } = await supabase.rpc("mark_story_read", { story_id: story.id });
  if (error) console.error("Failed to mark read:", error);
}

async function toggleSaved(story) {
  const next = !story.saved;
  story.saved = next;
  story.saved_at = next ? new Date().toISOString() : null;
  // Unsaving from the Saved view removes the card outright, so don't leave an
  // open body pointing at a story that's no longer rendered.
  if (!next && activeBucket === "saved" && openId === story.id) openId = null;
  renderNav();
  renderFeed();

  const { error } = await supabase.rpc("set_story_saved", { story_id: story.id, value: next });
  if (error) {
    console.error("Failed to save:", error);
    story.saved = !next;
    renderNav();
    renderFeed();
  }
}

async function toggleDismissed(story) {
  const next = !story.dismissed;
  story.dismissed = next;
  renderNav();
  renderFeed();
  try {
    const res = await fetch("/api/feedback", {
      method: "POST", headers: apiHeaders(),
      body: JSON.stringify({ story_id: story.id, dismissed: next }),
    });
    const result = await res.json();
    if (!res.ok || !result.ok) throw new Error(result.error || "Feedback failed");
  } catch (err) {
    console.error(err);
    story.dismissed = !next;
    renderNav();
    renderFeed();
  }
}

async function loadStories() {
  const { data, error } = await supabase
    .from("stories")
    .select("*")
    .order("published_at", { ascending: false, nullsFirst: false })
    .order("created_at", { ascending: false });

  if (error) {
    feedEl.innerHTML = `<div class="empty">${INFO_ICON}<span>Couldn't load stories — check the Supabase keys in index.html.</span></div>`;
    console.error(error);
    return;
  }

  stories = data || [];
  renderNav();
  renderFeed();

  const last = Number(localStorage.getItem(LAST_REFRESH_KEY) || 0);
  if (last) {
    stampEl.textContent = "Checked " + new Date(last).toLocaleString(undefined, {
      month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
    });
  } else if (stories.length) {
    stampEl.textContent = "Latest " + formatDay(dayOf(stories[0]));
  }
}

// Refresh runs one beat per call — Hobby's 60s cap and the free-tier
// tokens-per-minute ceiling both rule out doing all seven at once.
async function triggerRefresh() {
  if (refreshing) return;
  refreshing = true;
  refreshBtn.disabled = true;
  refreshBtn.classList.add("loading");
  progressTrack.classList.add("active");
  progressFill.style.width = "0%";

  let cursor = 0;
  let inserted = 0;
  let total = BUCKETS.length - 1;
  const problems = [];

  try {
    while (cursor !== null) {
      refreshLabel.textContent = `${Math.min(cursor + 1, total)} of ${total}`;
      const res = await fetch(`/api/refresh?cursor=${cursor}`, { method: "POST", headers: apiHeaders() });
      const result = await res.json();
      if (!res.ok || !result.ok) throw new Error(result.error || "Refresh failed");

      inserted += result.stories_inserted || 0;
      if (result.total_buckets) total = result.total_buckets;
      if (result.feed_health?.length) problems.push(...result.feed_health);

      progressFill.style.width = result.done ? "100%" : `${Math.round(((result.next || 0) / total) * 100)}%`;
      cursor = result.done ? null : result.next;
    }

    localStorage.setItem(LAST_REFRESH_KEY, String(Date.now()));
    await loadStories();
    refreshLabel.textContent = inserted ? `${inserted} new` : "Nothing new";

    if (problems.length) {
      console.warn("Feeds failing or returning nothing:", problems);
      feedNoteEl.textContent += ` · ${problems.length} feed${problems.length > 1 ? "s" : ""} need attention (see console)`;
    }
  } catch (err) {
    console.error(err);
    refreshLabel.textContent = "Failed";
    feedNoteEl.textContent = String(err.message || err).slice(0, 140);
  } finally {
    refreshing = false;
    refreshBtn.classList.remove("loading");
    refreshBtn.disabled = false;
    setTimeout(() => {
      refreshLabel.textContent = "Refresh";
      progressTrack.classList.remove("active");
      progressFill.style.width = "0%";
    }, 3500);
  }
}

async function submitStory() {
  const url = submitUrl.value.trim();
  if (!/^https?:\/\//i.test(url)) {
    submitStatus.textContent = "Needs a full http(s) URL.";
    submitStatus.classList.add("err");
    return;
  }
  submitGo.disabled = true;
  submitStatus.classList.remove("err");
  submitStatus.textContent = "Reading the page…";

  try {
    const res = await fetch("/api/submit", {
      method: "POST", headers: apiHeaders(),
      body: JSON.stringify({ url, bucket: submitBucket.value, note: submitNote.value.trim() }),
    });
    const result = await res.json();
    if (!res.ok || !result.ok) throw new Error(result.error || "Submit failed");

    submitStatus.textContent = result.already_present
      ? "Already in your feed — recorded as a preference."
      : `Added.${result.warning ? " " + result.warning + "." : ""} This source is now trusted.`;
    submitUrl.value = "";
    submitNote.value = "";
    await loadStories();
  } catch (err) {
    console.error(err);
    submitStatus.textContent = String(err.message || err).slice(0, 140);
    submitStatus.classList.add("err");
  } finally {
    submitGo.disabled = false;
  }
}

// --- wiring ----------------------------------------------------------------
BUCKETS.filter((b) => b.id !== "all").forEach((b) => {
  const opt = document.createElement("option");
  opt.value = b.id;
  opt.textContent = FULL_NAMES[b.id];
  submitBucket.appendChild(opt);
});

refreshBtn.addEventListener("click", triggerRefresh);
submitGo.addEventListener("click", submitStory);
submitUrl.addEventListener("keydown", (e) => { if (e.key === "Enter") submitStory(); });

menuBtn.addEventListener("click", () => {
  const open = menuEl.classList.toggle("open");
  menuBtn.setAttribute("aria-expanded", String(open));
});

tagFilterEl.addEventListener("change", (e) => {
  activeTag = e.target.value;
  openId = null;
  menuDot.classList.toggle("show", activeTag !== "all");
  renderFeed();
});

// Pull to refresh — phone only; the sticky bar covers the laptop.
let pullStart = null;
window.addEventListener("touchstart", (e) => {
  pullStart = window.scrollY <= 0 ? e.touches[0].clientY : null;
}, { passive: true });
window.addEventListener("touchmove", (e) => {
  if (pullStart === null || refreshing) return;
  const delta = e.touches[0].clientY - pullStart;
  pullEl.classList.toggle("show", delta > 70);
}, { passive: true });
window.addEventListener("touchend", () => {
  if (pullEl.classList.contains("show")) triggerRefresh();
  pullEl.classList.remove("show");
  pullStart = null;
}, { passive: true });

await loadStories();

// Hobby crons fire once a day and can't finish the whole loop, so the page
// keeps itself current when you open it.
const last = Number(localStorage.getItem(LAST_REFRESH_KEY) || 0);
if (Date.now() - last > STALE_HOURS * 3600 * 1000) triggerRefresh();
</script>
</body>
</html>
