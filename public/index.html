<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>NewsFeed</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F8;
    --surface:#FFFFFF;
    --surface-2:#F1F3F6;
    --text:#0F172A;
    --text-2:#334155;
    --muted:#64748B;
    --border:#E3E7ED;
    --border-strong:#CBD3DE;
    --accent:#2563EB;
    --accent-soft:#EEF3FF;
    --on-accent:#FFFFFF;
    --chip-on:#0F172A;
    --on-chip-on:#FFFFFF;
    --danger:#C0362C;
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 2px 10px rgba(15,23,42,.04);
    --shadow-hover:0 2px 4px rgba(15,23,42,.05), 0 10px 28px rgba(15,23,42,.08);
    --shadow-lg:0 24px 64px rgba(15,23,42,.18);
    --scrim:rgba(15,23,42,.32);
    --font:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --page:1120px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0B0D12;
      --surface:#14171E;
      --surface-2:#1B1F28;
      --text:#E8EBF0;
      --text-2:#C3C9D3;
      --muted:#8B93A1;
      --border:#242934;
      --border-strong:#353B48;
      --accent:#7AA2FF;
      --accent-soft:#18223A;
      --on-accent:#0B0D12;
      --chip-on:#E8EBF0;
      --on-chip-on:#0B0D12;
      --danger:#FF8A80;
      --shadow:0 1px 2px rgba(0,0,0,.3);
      --shadow-hover:0 8px 24px rgba(0,0,0,.4);
      --shadow-lg:0 24px 64px rgba(0,0,0,.55);
      --scrim:rgba(0,0,0,.55);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);}
  body{font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";}
  body.reading{overflow:hidden;}
  ::selection{background:color-mix(in srgb, var(--accent) 28%, transparent);}
  h1,h2,h3,p{margin:0;}
  a{color:var(--accent);}
  button,input,select{font:inherit;color:inherit;}
  button{cursor:pointer;}
  :focus{outline:none;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  svg{display:block;flex:none;}

  /* ---------- controls ---------- */
  .icon-btn{
    width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;flex:none;
    border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text-2);
  }
  .icon-btn:hover{border-color:var(--border-strong);color:var(--text);}
  .icon-btn:disabled{opacity:.5;cursor:default;}
  .icon-btn svg{width:17px;height:17px;}
  .js-refresh.loading svg{animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 15px;
    border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);
    font-weight:500;text-decoration:none;white-space:nowrap;
  }
  .btn:hover{border-color:var(--border-strong);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .btn.primary:hover{filter:brightness(1.07);}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted);}
  .btn.ghost:hover{color:var(--text);background:var(--surface-2);}
  .btn svg{width:16px;height:16px;}
  .btn.saved{color:var(--accent);border-color:color-mix(in srgb, var(--accent) 45%, transparent);background:var(--accent-soft);}

  .search{
    display:flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;
    border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--muted);
  }
  .search:focus-within{border-color:var(--accent);background:var(--surface);}
  .search svg{width:15px;height:15px;}
  .search input{flex:1;min-width:0;border:0;background:transparent;font-size:14px;color:var(--text);outline:none;}
  .search input::placeholder{color:var(--muted);}

  .chip{
    flex:none;display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;
    border-radius:999px;border:1px solid var(--border);background:var(--surface);
    font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap;
  }
  .chip:hover{border-color:var(--border-strong);}
  .chip.on{background:var(--chip-on);border-color:var(--chip-on);color:var(--on-chip-on);}

  .dot{width:8px;height:8px;border-radius:8px;flex:none;}
  .label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}

  /* ---------- progress + pull ---------- */
  .progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;pointer-events:none;}
  .progress .fill{height:100%;width:0;background:var(--accent);transition:width .3s ease,opacity .4s ease;opacity:0;}
  .progress.active .fill{opacity:1;}
  .pull{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:40;}
  .pull span{
    font-size:12px;color:var(--accent);background:var(--surface);border:1px solid var(--border);border-top:0;
    border-radius:0 0 10px 10px;padding:5px 14px;transform:translateY(-100%);transition:transform .2s ease;
  }
  .pull.show span{transform:translateY(0);}

  /* ---------- top bar + beat tabs ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--surface) 88%, transparent);
    -webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);
    border-bottom:1px solid var(--border);
  }
  .bar{max-width:var(--page);margin:0 auto;padding:12px 24px 0;display:flex;align-items:center;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.02em;margin-right:auto;border:0;background:none;padding:0;}
  .brand-mark{
    width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
    background:var(--text);color:var(--bg);font-size:14px;font-weight:700;
  }
  .bar .search{width:min(320px, 34vw);}
  .add-btn{min-height:38px;}
  .search-toggle{display:none;}
  .phone-search{display:none;}

  .tabs{
    max-width:var(--page);margin:0 auto;padding:6px 16px 0;display:flex;gap:2px;
    overflow-x:auto;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:none;display:inline-flex;align-items:center;gap:7px;padding:10px 10px 12px;
    border:0;border-bottom:2px solid transparent;background:transparent;
    font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;
  }
  .tab:hover{color:var(--text);}
  .tab.on{color:var(--text);border-bottom-color:var(--text);font-weight:600;}
  .tab .count{
    min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:inline-grid;place-items:center;
    font-size:11px;font-weight:600;background:var(--surface-2);color:var(--muted);
  }
  .tab.on .count{background:var(--accent-soft);color:var(--accent);}
  .tab svg{width:15px;height:15px;}
  .tab-sep{flex:none;width:1px;margin:10px 6px 12px;background:var(--border);}

  /* ---------- page ---------- */
  .page{max-width:var(--page);margin:0 auto;padding:32px 24px 96px;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .page-title{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.15;}
  .page-sub{margin-top:4px;font-size:14px;color:var(--muted);}
  .stamp{font-size:12.5px;color:var(--muted);}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px;}
  .filters:empty{display:none;}
  #feed{margin-top:24px;}

  .meta{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);min-width:0;}
  .meta .beat{font-weight:600;color:var(--text-2);}
  .meta .src{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .meta .time{white-space:nowrap;flex:none;}
  .new-dot{width:7px;height:7px;border-radius:7px;background:var(--accent);flex:none;margin-left:auto;}
  .cov{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--accent);}
  .cov svg{width:14px;height:14px;}

  /* lead + side cards */
  .front{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;}
  .front.solo{grid-template-columns:minmax(0,1fr);}
  .side{display:flex;flex-direction:column;gap:20px;}
  .card{
    display:flex;flex-direction:column;gap:10px;width:100%;padding:22px;text-align:left;
    border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);
    transition:box-shadow .15s ease, border-color .15s ease, transform .15s ease;
  }
  .card:hover{box-shadow:var(--shadow-hover);border-color:var(--border-strong);transform:translateY(-1px);}
  .card .title{font-weight:650;color:var(--text);letter-spacing:-.012em;}
  .card .teaser{color:var(--text-2);display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;}
  .card .foot{margin-top:auto;padding-top:4px;display:flex;align-items:center;gap:12px;}
  .hero{
    padding:30px;gap:14px;min-height:340px;
    background:linear-gradient(170deg, color-mix(in srgb, var(--beat, var(--accent)) 13%, var(--surface)) 0%, var(--surface) 62%);
  }
  .hero .kicker + .title{margin-top:auto;}
  .hero .kicker{
    align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
    font-size:12px;font-weight:600;background:var(--surface);color:var(--text);box-shadow:var(--shadow);
  }
  .hero .kicker .dot{background:var(--beat, var(--accent));}
  .hero .title{font-size:30px;line-height:1.18;font-weight:700;letter-spacing:-.025em;}
  .hero .teaser{font-size:16.5px;line-height:1.6;-webkit-line-clamp:5;}
  .side .card{flex:1;}
  .side .title{font-size:18px;line-height:1.3;}
  .side .teaser{font-size:14px;line-height:1.55;-webkit-line-clamp:3;}
  .card.read .title{color:var(--muted);font-weight:500;}
  .card.on{border-color:var(--accent);}

  /* beat sections */
  .sections{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:36px 28px;margin-top:44px;}
  .section-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .section-head h2{font-size:17px;font-weight:650;letter-spacing:-.01em;}
  .more{margin-left:auto;display:inline-flex;align-items:center;gap:2px;border:0;background:none;padding:4px 0;font-size:13px;font-weight:500;color:var(--accent);}
  .more svg{width:14px;height:14px;}

  .rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);}
  .row + .row{border-top:1px solid var(--border);}
  .row-btn{display:flex;flex-direction:column;gap:6px;width:100%;padding:16px 20px;text-align:left;border:0;background:transparent;}
  .row-btn:hover{background:var(--surface-2);}
  .row.on .row-btn{background:var(--accent-soft);}
  .row .title{font-size:15.5px;line-height:1.38;font-weight:600;color:var(--text);}
  .row.read .title{font-weight:400;color:var(--muted);}
  .row.dismissed,.card.dismissed{opacity:.5;}
  .row.dismissed .title,.card.dismissed .title{text-decoration:line-through;text-decoration-thickness:1px;}
  .list-block{margin-top:28px;}
  .list-block .label{display:block;margin-bottom:12px;}

  .pile-toggle{
    display:flex;align-items:center;gap:8px;margin:40px 0 12px;padding:6px 0;border:0;background:transparent;
    font-size:14px;font-weight:600;color:var(--muted);
  }
  .pile-toggle:hover{color:var(--text);}
  .pile-toggle svg{width:13px;height:13px;transition:transform .15s ease;}
  .pile-toggle[aria-expanded="true"] svg{transform:rotate(90deg);}
  .empty{
    padding:56px 24px;text-align:center;color:var(--muted);font-size:15px;line-height:1.6;
    border:1px dashed var(--border-strong);border-radius:16px;
  }
  .empty strong{display:block;font-size:18px;color:var(--text);margin-bottom:4px;}

  /* ---------- story drawer ---------- */
  .scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s ease;}
  body.reading .scrim{opacity:1;pointer-events:auto;}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;z-index:31;width:min(640px, 100vw);
    display:flex;flex-direction:column;background:var(--surface);box-shadow:var(--shadow-lg);
    transform:translateX(100%);visibility:hidden;
    transition:transform .28s cubic-bezier(.2,.8,.2,1), visibility 0s linear .28s;
  }
  body.reading .drawer{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1);}
  .drawer-bar{
    flex:none;display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);
  }
  .drawer-pos{margin-right:auto;font-size:13px;color:var(--muted);}
  .drawer-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:28px 32px 32px;}
  .drawer-foot{
    flex:none;display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border);background:var(--surface);
  }
  .drawer-foot .primary{flex:1;min-width:0;}
  .btn-text{min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .reader-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);}
  .beat-pill{
    display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-weight:600;font-size:12.5px;
    background:color-mix(in srgb, var(--beat) 15%, transparent);color:var(--text);
  }
  .beat-pill .dot{background:var(--beat);width:7px;height:7px;}
  .badge{font-style:italic;}
  .reader-title{margin-top:14px;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.022em;}
  .summary-block{margin-top:24px;padding:20px 22px;border-radius:14px;background:var(--surface-2);}
  .summary-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .label-note{font-size:12px;color:var(--muted);}
  .summary{margin-top:10px;font-size:16px;line-height:1.7;color:var(--text-2);}
  .summary p + p{margin-top:12px;}
  .summary.pending{font-size:14px;color:var(--muted);font-style:italic;display:flex;align-items:center;gap:10px;}
  .summary.pending::before{
    content:"";width:12px;height:12px;border-radius:50%;flex:none;
    border:1.5px solid color-mix(in srgb, var(--accent) 35%, transparent);border-top-color:var(--accent);
    animation:spin .7s linear infinite;
  }
  .coverage{margin-top:28px;}
  .cov-list{list-style:none;margin:10px 0 0;padding:0;}
  .cov-list li + li{border-top:1px solid var(--border);}
  .cov-item{display:flex;flex-direction:column;gap:2px;width:100%;padding:12px 0;text-align:left;border:0;background:transparent;}
  .cov-item:hover .cov-title{color:var(--accent);}
  .cov-item.read .cov-title{color:var(--muted);}
  .cov-src{font-size:12.5px;font-weight:600;color:var(--muted);}
  .cov-title{font-size:15px;line-height:1.4;color:var(--text);}

  /* ---------- dialogs ---------- */
  dialog{
    width:min(440px, calc(100vw - 32px));padding:0;border:1px solid var(--border);border-radius:18px;
    background:var(--surface);color:var(--text);box-shadow:var(--shadow-lg);
  }
  dialog::backdrop{background:var(--scrim);}
  .add-form{display:flex;flex-direction:column;gap:14px;padding:24px;}
  .add-form h2{font-size:19px;font-weight:700;letter-spacing:-.015em;}
  .field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--text-2);}
  .input{
    width:100%;min-height:42px;padding:8px 12px;font-size:14px;color:var(--text);background:var(--surface);
    border:1px solid var(--border-strong);border-radius:10px;
  }
  .input:focus-visible{border-color:var(--accent);outline-offset:0;}
  .note{font-size:13px;line-height:1.5;color:var(--muted);}
  .note.err{color:var(--danger);}
  .form-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;}

  /* ---------- tablet ---------- */
  @media (max-width: 960px){
    .front{grid-template-columns:minmax(0,1fr);}
    .side{flex-direction:row;}
    .sections{grid-template-columns:minmax(0,1fr);}
  }

  /* ---------- phone ---------- */
  @media (max-width: 680px){
    .bar{padding:10px 16px 0;gap:8px;}
    .bar .search{display:none;}
    .search-toggle{display:inline-flex;}
    .add-btn{width:38px;padding:0;}
    .add-btn .btn-label{display:none;}
    .phone-search{margin:10px 16px 2px;}
    .phone-search.open{display:flex;}
    .tabs{padding:4px 8px 0;}
    .tab{padding:10px 9px 11px;}
    .page{padding:22px 16px 72px;}
    .page-title{font-size:26px;}
    .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:16px -16px 0;padding:0 16px;}
    .filters::-webkit-scrollbar{display:none;}
    #feed{margin-top:18px;}
    .side{flex-direction:column;gap:12px;}
    .front{gap:12px;}
    .hero{padding:22px;min-height:0;}
    .hero .title{font-size:23px;}
    .hero .teaser{font-size:15.5px;-webkit-line-clamp:4;}
    .card{padding:18px;}
    .side .title{font-size:17px;}
    .sections{margin-top:32px;gap:28px;}
    .row-btn{padding:14px 16px;}
    .row .title{font-size:16px;}

    .drawer{width:100vw;}
    .drawer-body{padding:22px 20px 28px;}
    .reader-title{font-size:24px;}
    .summary-block{padding:16px 18px;}
    .drawer-foot .btn{min-height:46px;border-radius:12px;}
    .drawer-foot .js-save{width:46px;padding:0;}
    .drawer-foot .js-save .btn-label{display:none;}
  }
</style>
</head>
<body>

<div class="progress" id="progress-track"><div class="fill" id="progress-fill"></div></div>
<div class="pull" id="pull"><span>Release to refresh</span></div>

<header class="topbar">
  <div class="bar">
    <button class="brand" data-beat="all" aria-label="NewsFeed home"><span class="brand-mark" aria-hidden="true">N</span>NewsFeed</button>
    <label class="search">
      <span class="js-search-icon"></span>
      <span class="sr">Search stories</span>
      <input class="js-search" type="search" placeholder="Search stories" autocomplete="off">
    </label>
    <button class="icon-btn search-toggle" id="search-toggle" aria-label="Search" aria-expanded="false"></button>
    <button class="icon-btn js-refresh" aria-label="Refresh" title="Refresh"></button>
    <button class="btn add-btn js-add" aria-label="Add a story it missed" title="Add a story it missed"><span class="js-plus-icon"></span><span class="btn-label">Add story</span></button>
  </div>
  <label class="search phone-search" id="phone-search">
    <span class="js-search-icon"></span>
    <span class="sr">Search stories</span>
    <input class="js-search" type="search" placeholder="Search stories" autocomplete="off">
  </label>
  <nav class="tabs" id="tabs" aria-label="Beats"></nav>
</header>

<main class="page">
  <div class="page-head">
    <div>
      <h1 class="page-title" id="list-title">Top stories</h1>
      <div class="page-sub" id="list-sub"></div>
    </div>
    <div class="stamp" id="stamp"></div>
  </div>
  <div class="filters" id="tag-chips"></div>
  <div id="feed"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="reader" aria-label="Story" aria-live="polite"></aside>

<dialog id="add-dialog" aria-labelledby="add-title">
  <form class="add-form" method="dialog">
    <h2 id="add-title">Add a story it missed</h2>
    <label class="field">Article URL
      <input class="input" id="submit-url" type="url" placeholder="https://…" autocomplete="off">
    </label>
    <label class="field">Beat
      <select class="input" id="submit-bucket"></select>
    </label>
    <label class="field">Note (optional)
      <input class="input" id="submit-note" type="text">
    </label>
    <div class="note" id="submit-status">The source becomes trusted and shapes future picks.</div>
    <div class="form-btns">
      <button class="btn" value="cancel">Close</button>
      <button class="btn primary" type="button" id="submit-go">Add story</button>
    </div>
  </form>
</dialog>

<dialog id="key-dialog" aria-labelledby="key-title">
  <form class="add-form" method="dialog">
    <h2 id="key-title">Enter your access key</h2>

function esc(s) {

function apiHeaders() {

// One prompt at a time, however many calls hit a 401 together.
let secretPrompt = null;
function askForSecret() {
  if (secretPrompt) return secretPrompt;
  secretPrompt = new Promise((resolve) => {
    const form = keyDialog.querySelector("form");
    // Settle from the submit itself (it names the button pressed); Esc and
    // close are fallbacks for dismissing without a button.
    const finish = (save) => {
      form.removeEventListener("submit", onSubmit);
      keyDialog.removeEventListener("cancel", onDismiss);
      keyDialog.removeEventListener("close", onDismiss);
      const value = keyInput.value.trim();
      const saved = Boolean(save && value);
      if (saved) {
        try { localStorage.setItem(SECRET_KEY, value); } catch {}
      }
      secretPrompt = null;
      resolve(saved);
    };
    const onSubmit = (e) => finish(e.submitter?.value === "save");
    const onDismiss = () => finish(false);
    form.addEventListener("submit", onSubmit);
    keyDialog.addEventListener("cancel", onDismiss);
    keyDialog.addEventListener("close", onDismiss);
    keyInput.value = "";
    keyDialog.showModal();
    keyInput.focus();
  });
  return secretPrompt;
}

// POST to our API. A 401 means the key is missing or wrong: ask, then retry once.
async function apiPost(path, body) {
  const send = () => fetch(path, {
    method: "POST", headers: apiHeaders(),
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const res = await send();
  if (res.status === 401 && await askForSecret()) return send();
  return res;
}

function dayOf(s) {
  return s.published_at || s.found_on;

function unreadCount(bucketId) {

function relativeDay(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - d) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Yesterday";
  if (diff > 1 && diff < 7) return `${diff}d ago`;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function formatDay(dateStr) {
  if (!dateStr) return "Undated";
  const d = new Date(dateStr + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - d) / 86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Yesterday";
  return d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
}

// ---------------------------------------------------------------------------
// Full coverage: stories from different outlets about one event share most of
// their distinctive headline words. Mirrors sameStory() in api/refresh.js.
// ---------------------------------------------------------------------------
const STOP = new Set(("a an the and or of for to in on at by with from as is are was were be been " +
  "its it this that these those new news says said report reports will can could may " +
  "into onto over under after about than their they them what when where which while have has " +
  "data center centers centre network networks networking").split(" "));

function headlineTerms(title) {
  return [...new Set(String(title || "").toLowerCase()
    .replace(/[^a-z0-9\s-]/g, " ")
    .split(/\s+/)
    .filter((w) => w.length > 3 && !STOP.has(w))
    .map((w) => w.replace(/(es|s)$/, "")))];
}

function sameEvent(a, b) {
  const B = new Set(b);
  const shared = a.filter((t) => B.has(t)).length;
  const ratio = shared / Math.min(a.length, b.length);
  return (shared >= 3 && ratio >= 0.5) || (shared >= 2 && ratio >= 0.75);
}

// Input is newest-first, so each cluster's first story is its newest.
function clusterStories(list) {
  const out = [];
  for (const s of list) {
    const terms = headlineTerms(s.headline);
    const home = out.find((c) => c.terms.some((t) => sameEvent(terms, t)));
    if (home) {
      home.items.push(s);
      home.terms.push(terms);
    } else {
      out.push({ items: [s], terms: [terms] });
    }
  }
  return out;
}

function renderChips() {

function renderHead(unreadN, savedN) {

    || (activeBucket === "saved" ? `${savedN} saved`

}

function matchesQuery(s) {
  if (!query) return true;
  const q = query.toLowerCase();
  return [s.headline, s.source, s.teaser, s.tag].some((v) => String(v || "").toLowerCase().includes(q));
}

// Shared bits for every way a cluster is drawn.
function clusterInfo(cluster) {
  const items = cluster.items;
  const lead = items[0];
  const pinned = (s) => s.id === openId && !openWasRead;
  const selected = items.some((s) => s.id === openId);
  const unread = items.some((s) => !s.is_read);
  const read = !items.some((s) => !s.is_read || pinned(s));
  const outlets = new Set(items.map((s) => s.source)).size;
  const cls = `${selected ? " on" : ""}${read ? " read" : ""}${lead.dismissed ? " dismissed" : ""}`;
  const cov = items.length > 1
    ? `<span class="cov">${ICONS.layers}${outlets > 1 ? `${outlets} outlets covering this` : `${items.length} stories`}</span>` : "";
  const teaser = lead.teaser && lead.teaser.trim() !== String(lead.headline || "").trim() ? lead.teaser : "";
  return { lead, cls, cov, teaser, fresh: unread && !selected };
}

function metaHtml(lead, { showBeat, newDot }) {
  const label = showBeat ? beatLabel(lead.bucket) : (lead.tag && lead.tag !== "Other" ? lead.tag : "");
  return `
    <span class="meta">
      ${showBeat ? `<span class="dot" style="background:${BEAT_COLORS[lead.bucket] || "transparent"}"></span>` : ""}
      ${label ? `<span class="beat">${esc(label)}</span><span aria-hidden="true">·</span>` : ""}
      <span class="src">${esc(lead.source)}</span>
      <span aria-hidden="true">·</span>
      <span class="time">${esc(relativeDay(dayOf(lead)))}</span>
      ${newDot ? '<span class="new-dot" title="Unread"></span>' : ""}
    </span>`;
}

function heroHtml(cluster, { showBeat }) {
  const { lead, cls, cov, teaser } = clusterInfo(cluster);
  const kicker = lead.tag && lead.tag !== "Other" ? lead.tag : "Top story";
  return `
    <button class="card hero${cls}" data-open="${lead.id}" style="--beat:${BEAT_COLORS[lead.bucket] || "var(--accent)"}">
      <span class="kicker"><span class="dot"></span>${esc(kicker)}</span>
      <span class="title">${esc(lead.headline)}</span>

function sideHtml(cluster, { showBeat }) {
  const { lead, cls, cov, teaser, fresh } = clusterInfo(cluster);
  return `
    <button class="card${cls}" data-open="${lead.id}">

function rowHtml(cluster, { showBeat }) {
  const { lead, cls, cov, fresh } = clusterInfo(cluster);

    <li class="row${cls}">

}

const rowsHtml = (list, opts) => `<ul class="rows">${list.map((c) => rowHtml(c, opts)).join("")}</ul>`;

// Lead story large, the next two beside it.
function frontHtml(list, opts) {
  const [lead, ...side] = list;
  return `
    <div class="front${side.length ? "" : " solo"}">
      ${heroHtml(lead, opts)}
      ${side.length ? `<div class="side">${side.map((c) => sideHtml(c, opts)).join("")}</div>` : ""}

function emptyHtml(title, body) {
  return `<div class="empty">${title ? `<strong>${esc(title)}</strong>` : ""}${esc(body)}</div>`;
}

// Saved is its own view: no grouping, no read pile, ordered by when you
// saved it rather than when it was published.
function renderSaved() {
  const list = stories
    .filter((s) => s.saved && matchesQuery(s))
    .sort((a, b) => String(b.saved_at || "").localeCompare(String(a.saved_at || "")));
  clusters = list.map((s) => ({ items: [s] }));
  renderHead(0, list.length);

  if (!list.length) {
    feedEl.innerHTML = query
      ? emptyHtml("", "No saved stories match that search.")
      : emptyHtml("Nothing saved yet", "Save any story and it collects here, newest save first.");
    return;
  }
  feedEl.innerHTML = rowsHtml(clusters, { showBeat: true });
}

function renderFeed() {
  renderChips();
  if (activeBucket === "saved") return renderSaved();

  const pinnedUp = (s) => s.id === openId && !openWasRead;
  let list = stories.filter((s) => (activeBucket === "all" || s.bucket === activeBucket) && matchesQuery(s));
  if (activeChip === "unread") list = list.filter((s) => !s.is_read || pinnedUp(s));
  else if (activeChip !== "all") list = list.filter((s) => s.tag === activeChip);

  clusters = clusterStories(list);
  const fresh = clusters.filter((c) => c.items.some((s) => !s.is_read || pinnedUp(s)));
  const read = clusters.filter((c) => !fresh.includes(c));
  renderHead(list.filter((s) => !s.is_read && !s.dismissed).length, 0);

  if (!list.length) {
    feedEl.innerHTML = query ? emptyHtml("", "No stories match that search.")
      : activeChip !== "all" ? emptyHtml("", "Nothing here with that filter.")
      : emptyHtml("Nothing in this beat yet", "Refresh to check the feeds, or add a story it missed.");
    return;
  }

  const showBeat = activeBucket === "all";
  const opts = { showBeat };
  let main = "";

  if (!fresh.length) {
    main = emptyHtml("All caught up", "Everything here has been read. New stories land after the next refresh.");
  } else if (query || activeChip !== "all") {
    // Searching or filtering is scanning: a plain list reads fastest.
    main = rowsHtml(fresh, opts);
  } else {
    // The lead and side cards go to the most widely covered events; ties stay
    // newest first (sort is stable). Everything else keeps date order.
    const outlets = (c) => new Set(c.items.map((s) => s.source)).size;
    const top = [...fresh].sort((x, y) => outlets(y) - outlets(x)).slice(0, 3);
    const rest = fresh.filter((c) => !top.includes(c));
    main = frontHtml(top, opts);
    if (rest.length && activeBucket === "all") {
      // The rest of the front page, grouped under each beat.
      const sections = BUCKETS.filter((b) => b.id !== "all").map((b) => {
        const mine = rest.filter((c) => c.items[0].bucket === b.id);
        if (!mine.length) return "";
        return `
          <section>
            <div class="section-head">
              <span class="dot" style="background:${BEAT_COLORS[b.id]}"></span>
              <h2>${esc(beatLabel(b.id))}</h2>
              <button class="more" data-beat="${b.id}">All ${esc(beatLabel(b.id))}${ICONS.chevron}</button>
            </div>
            ${rowsHtml(mine, { showBeat: false })}
          </section>`;
      }).join("");
      main += `<div class="sections">${sections}</div>`;
    } else if (rest.length) {
      main += `<div class="list-block"><span class="label">More stories</span>${rowsHtml(rest, opts)}</div>`;
    }
  }

  const showPile = pileOpen || read.some((c) => c.items.some((s) => s.id === openId));
  feedEl.innerHTML = `
    ${main}
    ${read.length ? `
      <button class="pile-toggle" data-action="pile" aria-expanded="${showPile}">${ICONS.chevron}Already read · ${read.length}</button>
      ${showPile ? rowsHtml(read, opts) : ""}` : ""}`;
}

function summaryHtml(s) {
  if (!s.summary) return '<div class="summary pending">Writing summary…</div>';
  const paras = String(s.summary).split(/\n\s*\n/).map((p) => `<p>${esc(p.trim())}</p>`).join("");
  return `<div class="summary">${paras}</div>`;
}

function nextUnread() {
  const fresh = clusters.filter((c) => c.items.some((s) => !s.is_read && !s.dismissed));
  return fresh.map((c) => c.items.find((s) => !s.is_read && !s.dismissed)).find((s) => s && s.id !== openId) || null;
}

function renderReader() {
  const s = openId !== null ? byId(openId) : null;
  if (!s) {
    readerEl.innerHTML = "";
    return;
  }

  const cluster = clusters.find((c) => c.items.some((x) => x.id === s.id)) || { items: [s] };
  const others = cluster.items.filter((x) => x.id !== s.id);
  const outlets = new Set(cluster.items.map((x) => x.source)).size;
  const remaining = clusters.filter((c) => c.items.some((x) => !x.is_read && !x.dismissed)).length;
  const next = nextUnread();

  readerEl.innerHTML = `
    <div class="drawer-bar">
      <button class="icon-btn" data-action="back" aria-label="Close story">${ICONS.close}</button>
      <span class="drawer-pos">${remaining ? `${remaining} unread left` : "All caught up"}</span>
      ${next ? `<button class="btn ghost" data-action="next">Next unread${ICONS.next}</button>` : ""}
    </div>
    <div class="drawer-body">
      <div class="reader-meta">
        <span class="beat-pill" style="--beat:${BEAT_COLORS[s.bucket] || "var(--muted)"}"><span class="dot"></span>${esc(beatLabel(s.bucket))}</span>
        ${s.tag && s.tag !== "Other" ? `<span>${esc(s.tag)}</span><span aria-hidden="true">·</span>` : ""}
        <span>${esc(s.source)}</span><span aria-hidden="true">·</span><span>${esc(relativeDay(dayOf(s)) || "Date unknown")}</span>
        ${s.is_blog ? '<span class="badge">· Blog post</span>' : ""}
        ${s.is_manual ? '<span class="badge">· Added by you</span>' : ""}
      </div>
      <h2 class="reader-title">${esc(s.headline)}</h2>
      <section class="summary-block">
        <div class="summary-head">
          <h3 class="label">Summary</h3>
          <span class="label-note">AI summary · check the source for detail</span>
        </div>
        ${summaryHtml(s)}
      </section>
      ${others.length ? `
        <section class="coverage">
          <h3 class="label">Full coverage · ${outlets} outlet${outlets > 1 ? "s" : ""}</h3>
          <ul class="cov-list">
            ${others.map((x) => `
              <li><button class="cov-item${x.is_read ? " read" : ""}" data-open="${x.id}">
                <span class="cov-src">${esc(x.source)}</span>
                <span class="cov-title">${esc(x.headline)}</span>
              </button></li>`).join("")}
          </ul>
        </section>` : ""}
    </div>
    <div class="drawer-foot">
      <a class="btn primary" href="${esc(s.url)}" target="_blank" rel="noopener"><span class="btn-text">Read on ${esc(s.source)}</span>${ICONS.external}</a>
      <button class="btn js-save${s.saved ? " saved" : ""}" aria-pressed="${s.saved}" aria-label="${s.saved ? "Remove from saved" : "Save story"}">${s.saved ? ICONS.bookmarkFill : ICONS.bookmark}<span class="btn-label">${s.saved ? "Saved" : "Save"}</span></button>
      <button class="btn ghost js-dismiss" title="Show me less like this">${s.dismissed ? "Undo" : "Not relevant"}</button>
    </div>`;
}

// ---------------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------------
let lastFocus = null;

function openStory(s) {
  if (!s) return;
  const wasOpen = openId !== null;
  if (openId !== s.id) {
    openWasRead = s.is_read;
    openId = s.id;
  }
  // The back button / gesture closes the drawer.
  if (history.state?.story !== undefined) history.replaceState({ story: s.id }, "");
  else history.pushState({ story: s.id }, "");
  if (!wasOpen) lastFocus = document.activeElement;
  if (!s.summary) ensureSummary(s);
  if (!s.is_read) markRead(s);
  render();
  readerEl.querySelector(".drawer-body")?.scrollTo({ top: 0 });
  readerEl.querySelector('[data-action="back"]')?.focus({ preventScroll: true });
}

function closeStory() {
  openId = null;
  render();
  lastFocus?.focus?.({ preventScroll: true });
  lastFocus = null;
}

// Leave through history when the drawer put an entry there, so Back stays in step.
function dismissDrawer() {
  if (history.state?.story !== undefined) history.back();
  else closeStory();
}

function selectBeat(id) {
  if (openId !== null) dismissDrawer();
  activeBucket = id;
  if (id === "saved") activeChip = "all";
  render();
  window.scrollTo({ top: 0 });
}

async function ensureSummary(story) {
  try {
    const res = await apiPost("/api/summarize", { story_id: story.id });
    const result = await res.json();
    if (!res.ok || !result.ok) throw new Error(result.error || "Summary failed");
    story.summary = result.summary;
  } catch (err) {
    console.error(err);
    story.summary = "Couldn't write a summary — open the source instead.";
  }
  if (openId === story.id) renderReader();
}

async function markRead(story) {
  story.is_read = true;
  const { error } = await supabase.rpc("mark_story_read", { story_id: story.id });
  if (error) console.error("Failed to mark read:", error);
}

async function toggleSaved(story) {
  const next = !story.saved;
  story.saved = next;
  story.saved_at = next ? new Date().toISOString() : null;
  render();

  const { error } = await supabase.rpc("set_story_saved", { story_id: story.id, value: next });
  if (error) {
    console.error("Failed to save:", error);
    story.saved = !next;
    render();
  }
}

async function toggleDismissed(story) {
  const next = !story.dismissed;
  story.dismissed = next;
  render();
  try {
    const res = await apiPost("/api/feedback", { story_id: story.id, dismissed: next });
    const result = await res.json();
    if (!res.ok || !result.ok) throw new Error(result.error || "Feedback failed");
  } catch (err) {
    console.error(err);
    story.dismissed = !next;
    render();
  }
}

async function loadStories() {
  const { data, error } = await supabase
    .from("stories")
    .select("*")
    .order("published_at", { ascending: false, nullsFirst: false })
    .order("created_at", { ascending: false });

  if (error) {
    feedEl.innerHTML = '<div class="empty">Couldn\'t load stories — check the Supabase keys in index.html.</div>';
    console.error(error);
    return;
  }

  stories = data || [];
  render();

  const last = Number(localStorage.getItem(LAST_REFRESH_KEY) || 0);
  if (last) {
    stampEl.textContent = "Checked " + new Date(last).toLocaleString(undefined, {
      month: "short", day: "numeric", hour: "numeric", minute: "2-digit",
    });
  } else if (stories.length) {
    stampEl.textContent = "Latest " + formatDay(dayOf(stories[0]));
  }
}

function setRefreshStatus(text) {
  refreshStatus = text;
  renderHead(unreadCount(activeBucket === "saved" ? "all" : activeBucket), stories.filter((s) => s.saved).length);
}

// Refresh runs one beat per call — Hobby's 60s cap and the free-tier
// tokens-per-minute ceiling both rule out doing all seven at once.
async function triggerRefresh() {
  if (refreshing) return;
  refreshing = true;
  refreshBtns.forEach((b) => { b.disabled = true; b.classList.add("loading"); });
  progressTrack.classList.add("active");
  progressFill.style.width = "0%";

  let cursor = 0;
  let inserted = 0;
  let total = BUCKETS.length - 1;
  const problems = [];

  try {
    while (cursor !== null) {
      setRefreshStatus(`Checking feeds · ${Math.min(cursor + 1, total)} of ${total}`);
      const res = await apiPost(`/api/refresh?cursor=${cursor}`);
      const result = await res.json();
      if (!res.ok || !result.ok) throw new Error(result.error || "Refresh failed");

      inserted += result.stories_inserted || 0;
      if (result.total_buckets) total = result.total_buckets;
      if (result.feed_health?.length) problems.push(...result.feed_health);

      progressFill.style.width = result.done ? "100%" : `${Math.round(((result.next || 0) / total) * 100)}%`;
      cursor = result.done ? null : result.next;
    }

    localStorage.setItem(LAST_REFRESH_KEY, String(Date.now()));
    refreshStatus = inserted ? `${inserted} new ${inserted === 1 ? "story" : "stories"}` : "Nothing new";
    if (problems.length) {
      console.warn("Feeds failing or returning nothing:", problems);
      refreshStatus += ` · ${problems.length} feed${problems.length > 1 ? "s" : ""} need attention`;
    }
    await loadStories();
  } catch (err) {
    console.error(err);
    setRefreshStatus("Refresh failed — " + String(err.message || err).slice(0, 100));
  } finally {
    refreshing = false;
    refreshBtns.forEach((b) => { b.disabled = false; b.classList.remove("loading"); });
    setTimeout(() => {
      progressTrack.classList.remove("active");
      progressFill.style.width = "0%";
      setRefreshStatus("");
    }, 3500);
  }
}

async function submitStory() {
  const url = submitUrl.value.trim();
  if (!/^https?:\/\//i.test(url)) {
    submitStatus.textContent = "Needs a full http(s) URL.";
    submitStatus.classList.add("err");
    return;
  }
  submitGo.disabled = true;
  submitStatus.classList.remove("err");
  submitStatus.textContent = "Reading the page…";

  try {
    const res = await apiPost("/api/submit", { url, bucket: submitBucket.value, note: submitNote.value.trim() });
    const result = await res.json();
    if (!res.ok || !result.ok) throw new Error(result.error || "Submit failed");

    submitStatus.textContent = result.already_present
      ? "Already in your feed — recorded as a preference."
      : `Added.${result.warning ? " " + result.warning + "." : ""} This source is now trusted.`;
    submitUrl.value = "";
    submitNote.value = "";
    await loadStories();
  } catch (err) {
    console.error(err);
    submitStatus.textContent = String(err.message || err).slice(0, 140);
    submitStatus.classList.add("err");
  } finally {
    submitGo.disabled = false;
  }
}

function openAdd() {
  submitStatus.classList.remove("err");
  submitStatus.textContent = "The source becomes trusted and shapes future picks.";
  if (activeBucket !== "all" && activeBucket !== "saved") submitBucket.value = activeBucket;
  addDialog.showModal();
  submitUrl.focus();
}

// --- wiring ----------------------------------------------------------------
refreshBtns.forEach((b) => { b.innerHTML = ICONS.refresh; b.addEventListener("click", triggerRefresh); });
document.querySelectorAll(".js-search-icon").forEach((el) => { el.outerHTML = ICONS.search; });
document.querySelector(".js-plus-icon").outerHTML = ICONS.plus;
searchToggle.innerHTML = ICONS.search;

BUCKETS.filter((b) => b.id !== "all").forEach((b) => {
  const opt = document.createElement("option");
  opt.value = b.id;
  opt.textContent = FULL_NAMES[b.id];
  submitBucket.appendChild(opt);
});

const onBeatClick = (e) => {
  const b = e.target.closest("[data-beat]");
  if (b) selectBeat(b.dataset.beat);
};
tabsEl.addEventListener("click", onBeatClick);
document.querySelector(".brand").addEventListener("click", onBeatClick);

tagChipsEl.addEventListener("click", (e) => {
  const c = e.target.closest("[data-chip]");
  if (!c) return;
  activeChip = c.dataset.chip;
  render();
});

feedEl.addEventListener("click", (e) => {
  const open = e.target.closest("[data-open]");
  if (open) return openStory(byId(open.dataset.open));
  const beat = e.target.closest("[data-beat]");
  if (beat) return selectBeat(beat.dataset.beat);
  if (e.target.closest('[data-action="pile"]')) {
    pileOpen = !pileOpen;
    renderFeed();
  }
});

readerEl.addEventListener("click", (e) => {
  const s = byId(openId);
  const t = e.target;
  if (t.closest("[data-open]")) return openStory(byId(t.closest("[data-open]").dataset.open));
  if (t.closest('[data-action="back"]')) return dismissDrawer();
  if (!s) return;
  if (t.closest('[data-action="next"]')) {
    const n = nextUnread();
    if (n) openStory(n);
    else dismissDrawer();
  }
  if (t.closest(".js-save")) toggleSaved(s);
  if (t.closest(".js-dismiss")) toggleDismissed(s);
});

scrimEl.addEventListener("click", dismissDrawer);

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || openId === null) return;
  if (addDialog.open || keyDialog.open) return;
  e.preventDefault();
  dismissDrawer();
});

// Back button / gesture closes the drawer.
window.addEventListener("popstate", (e) => {
  if (e.state?.story === undefined && openId !== null) closeStory();
});

searchInputs.forEach((input) => input.addEventListener("input", () => {
  query = input.value.trim();
  searchInputs.forEach((other) => { if (other !== input) other.value = input.value; });
  renderFeed();
}));

searchToggle.addEventListener("click", () => {
  const open = phoneSearch.classList.toggle("open");
  searchToggle.setAttribute("aria-expanded", String(open));
  if (open) phoneSearch.querySelector("input").focus();
});

document.querySelector(".js-add").addEventListener("click", openAdd);

submitGo.addEventListener("click", submitStory);
submitUrl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); submitStory(); }
});

// Pull to refresh on touch screens.
let pullStart = null;
window.addEventListener("touchstart", (e) => {
  pullStart = window.scrollY <= 0 && openId === null ? e.touches[0].clientY : null;
}, { passive: true });
window.addEventListener("touchmove", (e) => {
  if (pullStart === null || refreshing) return;
  const delta = e.touches[0].clientY - pullStart;
  pullEl.classList.toggle("show", delta > 70);
}, { passive: true });
window.addEventListener("touchend", () => {
  if (pullEl.classList.contains("show")) triggerRefresh();
  pullEl.classList.remove("show");
  pullStart = null;
}, { passive: true });

// A reload with a story entry in history would leave Back pointing nowhere.
if (history.state?.story !== undefined) history.replaceState(null, "");

await loadStories();

// Hobby crons fire once a day and can't finish the whole loop, so the page
// keeps itself current when you open it. Without a key, wait for a manual
// refresh rather than greeting every visitor with a prompt.
const last = Number(localStorage.getItem(LAST_REFRESH_KEY) || 0);
if (readSecret() && Date.now() - last > STALE_HOURS * 3600 * 1000) triggerRefresh();
</script>
</body>
</html>
